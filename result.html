<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: transparent;
      font-size: 36px;
      font-family: Diablo;
      color: White;
    }
  </style>
</head>
<body>
  <div id="result">Class: just roll</div>

  <script>
    function updateResult() {
  const stored = localStorage.getItem("lastResult");
  if (!stored) return; // zostaw "Class: just roll" dopóki nie ma wyniku

  const match = stored.match(/^([^(]+)(\(.*\))?$/);
  let mainName = stored;
  let parentheses = "";

  if (match) {
    mainName = match[1].trim();
    parentheses = match[2] ? match[2].trim() : "";
  }

  document.getElementById("result").innerHTML =
    `Klasa/Class: ${mainName}` + (parentheses ? `<br>${parentheses}` : "");
}

// ← aaaa
    updateResult();
    setInterval(updateResult, 500);
  </script>
</body>
</html>
