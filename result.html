<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
body{
      color: #ffffff;
      text-transform: uppercase;
      border-radius: 10px;
      border: 1px solid #c4c4c4;
      box-shadow: 0 0 6px #000;    
      font-size: 68px;
      font-family: 'Diablo', serif;
      line-height: 1;
      display: inline-block;
      margin: 0;
      padding: 8px 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      
      
      
      /* Efekt świecenia */
      filter: drop-shadow(0 0 8px rgba(220, 20, 60, 0.6))
              drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
      
      /* Animacja pulsowania */
      animation: bloodPulse 2s ease-in-out infinite alternate;
    }

    @keyframes bloodPulse {
      from {
        filter: drop-shadow(0 0 5px rgba(220, 20, 60, 0.4))
                drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
      }
      to {
        filter: drop-shadow(0 0 15px rgba(220, 20, 60, 0.8))
                drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
      }
    }

    /* Mobile */
    @media (max-width: 768px) {
      body {
        font-size: 24px; /* mniejszy tekst na telefonie */
      }
    }
  </style>
</head>
<body>
  <div id="result">Class: Just choose your destiny</div>

  <script>
   function updateResult() {
  const stored = localStorage.getItem("lastResult");
  const el = document.getElementById("result");

  if (!stored) {
    el.innerHTML = "Class: Just choose your destiny"; 
    return;
  }

  const match = stored.match(/^([^(]+)(\(.*\))?$/);
  let mainName = stored;
  let parentheses = "";

  if (match) {
    mainName = match[1].trim();
    parentheses = match[2] ? match[2].trim() : "";
  }

  // Dodaj <wbr> po każdym "/"
  mainName = mainName.replace(/\//g, "/<wbr>");
  parentheses = parentheses.replace(/\//g, "/<wbr>");

  el.innerHTML = `Class: ${mainName}` + (parentheses ? `<br>${parentheses}` : "");
}


// ← aaaa
    updateResult();
    setInterval(updateResult, 500);
  </script>
</body>
</html>
