<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: transparent;
      font-size: 36px;
      font-family: Diablo;
      color: White;
    }
  </style>
</head>
<body>
  <div id="result">Class: Just choose your destiny</div>

  <script>
   function updateResult() {
  const stored = localStorage.getItem("lastResult");
  const el = document.getElementById("result");

  if (!stored) {
    el.innerHTML = "Class: just roll"; // <- wraca do domyślnego
    return;
  }

  const match = stored.match(/^([^(]+)(\(.*\))?$/);
  let mainName = stored;
  let parentheses = "";

  if (match) {
    mainName = match[1].trim();
    parentheses = match[2] ? match[2].trim() : "";
  }

  el.innerHTML = `Class: ${mainName}` + (parentheses ? `<br>${parentheses}` : "");
}


// ← aaaa
    updateResult();
    setInterval(updateResult, 500);
  </script>
</body>
</html>
