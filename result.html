<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: transparent;
      font-size: 30px;
      font-family: Diablo;
      color: White;
       white-space: normal;   /* tekst może się łamać */
  word-wrap: break-word; /* jeśli mega długa nazwa, np. bez spacji, to też się złamie */
  overflow-wrap: break-word;
  text-align: center;    /* opcjonalnie żeby było ładnie na środku */
    }
  </style>
</head>
<body>
  <div id="result">Class: Just choose your destiny</div>

  <script>
   function updateResult() {
  const stored = localStorage.getItem("lastResult");
  const el = document.getElementById("result");

  if (!stored) {
    el.innerHTML = "Class: Just choose your destiny"; // <- wraca do domyślnego
    return;
  }

  const match = stored.match(/^([^(]+)(\(.*\))?$/);
  let mainName = stored;
  let parentheses = "";

  if (match) {
    mainName = match[1].trim();
    parentheses = match[2] ? match[2].trim() : "";
  }

  el.innerHTML = `Class: ${mainName}` + (parentheses ? `<br>${parentheses}` : "");
}


// ← aaaa
    updateResult();
    setInterval(updateResult, 500);
  </script>
</body>
</html>
