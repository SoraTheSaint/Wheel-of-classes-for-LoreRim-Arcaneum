<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: transparent;
      font-size: 36px;
      font-family: Diablo;
      color: White;
    }
  </style>
</head>
<body>
  <div id="result">Klasa/Class: brak</div>

  <script>
    function updateResult() {
      const result = localStorage.getItem("lastResult") || "brak";
      const match = result.match(/^([^\(]+)(\(.*\))?$/);
      let mainName = result;
      let parentheses = "";

      if (match) {
        mainName = match[1].trim();
        parentheses = match[2] ? match[2].trim() : "";
      }

      document.getElementById("result").innerHTML = 
        `Klasa/Class: ${mainName}` + 
        (parentheses ? `<br>${parentheses}` : "");
    }

    updateResult();
    setInterval(updateResult, 500);
  </script>
</body>
</html>
