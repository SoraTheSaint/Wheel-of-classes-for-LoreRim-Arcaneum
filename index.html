<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Wheel of Classes - LoreRim Arcaneum </title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ghastly+Panic&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
      height: 100vh;
      position: relative;
    }
    canvas {
      display: block;
      margin: auto;
      background-color: rgba(0, 0, 0, 0.3);
    }
    .button {
      position: absolute;
      left: 10px;
      width: 200px;
      font-size: 20px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
      color: white;
      user-select: none;
    }
    #spinButton { top: 10px; background-color: #28a745; }
    #resetButton { top: 60px; background-color: #dc3545; }

    #resultText, #counter {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #endMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 90%;
      text-align: center;
      font-family: 'Ghastly Panic', cursive;
      font-size: 50px;
      color: #8B0000;
      background-color: rgba(0, 0, 0, 0.8);
      font-weight: bold;
      padding: 20px;
      border-radius: 12px;
      z-index: 20;
      display: none;
      user-select: none;
    }

    #pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-top: 40px solid #e91e63;
      z-index: 15;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <button id="spinButton" class="button">Choose destiny</button>
  <button id="resetButton" class="button">Reset</button>
  <div style="position:absolute; top:120px; left:10px; width:220px; display:flex; flex-direction:column; gap:10px;">
    <iframe src="counter.html" width="420" height="220" style="border:none; background:transparent;"></iframe>
    <iframe src="result.html" width="420" height="520" style="border:none; background:transparent;"></iframe>
  </div>

  <div id="resultText">Score: —</div>
  <div id="counter">Rolls: 0</div>
  <div id="endMessage">You died a lot of time</div>
  <div id="pointer"></div>
  <canvas id="wheelCanvas" width="900" height="900"></canvas>

  <div style="display:flex; gap:20px; justify-content:center; margin-top:20px;">
</div>

  <audio id="soundSelect" src="area.mp3" preload="auto"></audio>
  <audio id="soundEnd" src="you-died.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinButton = document.getElementById('spinButton');
    const resetButton = document.getElementById('resetButton');
    const resultText = document.getElementById('resultText');
    const counterText = document.getElementById('counter');
    const endMessage = document.getElementById('endMessage');
    const pointer = document.getElementById('pointer');
    const soundSelect = document.getElementById('soundSelect');
    const soundEnd = document.getElementById('soundEnd');

    const originalSegments = ["Aethermage (Shock Magic/Heavy Armor/Trait 'Disbeliever'/Finesse)",
  "Alchemist (Alchemy/Traps/Poison)",
  "Ancient Runesmith (Dwemer Smithing, Enchanting, Runes, Automatons)",
  "Arcane Mage (Arcane Destro)",
  "Ashblade Dervish (LA/Scimitar/Destruction Fire Touch spells)",
  "Assassin (stealth/daggers/Alchemy (Poison-focused))",
  "Aurafist (Unarmed/Restoration/Alteration)",
  "Battlemage (HA/Destro Touch spell/Quarter Staff)",
  "Berserker (2H Axe/Unarmored/trait 'Rage')",
  "Blightborn (Alchemy/Restoration Poison/Trait 'Defiler')",
  "Blood Knight (2H Sword/HA/Blood cloak)",
  "Blood Mage (Blood destro) => Vampire",
  "Boltwarden (HA/Heavy Crossbow)",
  "Brawler (Unarmored/Unarmed/No spells/Dodge)",
  "Brewmaster (Staff/Alchemy/Trait 'Addict')",
  "Companion of Jorrvaskr (HA 'Wolf Armor'/2H Axe/Werewolf)",
  "Cryomancer (Cryo Destro)",
  "Dawnguard Sentinel (Restoration/Archery) <by Cor Wulfgar>",
  "Death Knight (2H/HA/Conjuration Necro)",
  "Dragon Slayer (LA/Nodachi 2h)",
  "Dragonborn of the North (1h/Block/Shouts/HA/Trait 'Old Fashioned')",
  "Dragoon (Heavy armor/2H Spear/Horse Combat)",
  "Druid (Alteration Transform/LA/Conjuration Spirit/trait 'Druid')",
  "Electromancer (Electro Destro)",
  "Elementalist (Fire/Cryo/Electro Destro)",
  "Entropic Wizard (Entropic Destro)",
  "Explorer (LA/Whip/Torch)",
  "Flameforged Champion (HA/GS/Fire Cloak)",
  "Frostbound Titan (HA/Warhammer/Cryo Cloak)",
  "Gambler(LA/Dual Daggers/Trait 'Gambler')",
  "Gandalf (Enchanting Staff/1h sword)",
  "General (Speech/1H sword/HA/followers)",
  "Graveblade (1H/Summon Undead/Unarmored/Lockpicking)",
  "Greybeard (Unarmored/Speech/Alteration)",
  "Guru (Alteration telekinesis/Emotional Illusion)",
  "Guttersnipe (Unarmed/Finesse/Sneak/Trait 'Lurker'/Trait 'Nosferatu')",
  "Harbinger of Oblivion (Conjuration/Destruction/Only deadric items)",
  "Hexblade (Bound Sword/Conjuration/Fire Destro)",
  "Hunter (LA/ light Bow)",
  "Iron Rose/Duelist (Rapier with empty hand perk/LA)",
  "Mesmer (Illusion/Rapier)",
  "Necromancer (Conjuration Necro) => Dread Lich (Conjuration/Alteration/Necromancy/Unarmored)",
  "Nightblade (Sneak/Illussion)",
  "Oathbound Defender (1H/Block/Restoration/Speech/Heavy Armor)",
  "Occultist (Entropy/Conjuration/Scrolls)",
  "Paladin Meridia (1h/Sun Resto/HA)",
  "Phantom Ranger (Sneak/Bound Bow/LA)",
  "Plauge Knight (HA/Mace/Resto poisions)",
  "Priestess Dibella (Female/Ilussion/Speech/Trait 'Au Naturel') -> Dreamwalker (Illusion/Alteration/Speech)",
  "Priestess Mara (Restoration/Speech)",
  "Primal Forsworn (dual axes/Alteration/Spirit Conjuration/Forsworn armor)",
  "Pyromancer (Fire Destro)",
  "Runecaster (Runes/Destruction/Illusion or Alchemy)",
  "Runespear (Enchanting/Alteration/2h Spear)",
  "Shadowdancer (Light Armor/Illusion/Daggers/No sneak)",
  "Sith (1h/Destro Lighting/Alteration)",
  "Sniper (Heavy Bow/LA)",
  "Spellbreaker (Heavy Armor/Alteration/1H+Shield)",
  "Spellforged Knight (Enchanting trait/1h + shield)",
  "Spiritcaller (Spirit conjuration)",
  "Spiritstalker (LA/Bow/Spirit conjuration)",
  "Stendar Zealot (2H/Unarmored/Block)",
  "Stormsinger (Shouts/Illusion/Electro Destro)",
  "The Bard (Speech/Alteration Sounds/Illusion/1H)",
  "The Hooked One (Argonian/1H/Enchanting/LA/trait 'Angler'/Trait 'Swimmer')",
  "The Profaned Monk of Sheogorath (Unarmored/Blight Fists/Entropy/Sheogorath deity)",
  "Thornscale Saint of Arkay (Argonian/Alteration Transmutation/Restoration Heal/Heavy Armor/Deity Arkay)",
  "Veteran of the Forge (Smithing/1h mace/HA/Deity Zenithar)",
  "Voicebreaker (HA/Warhammer/Shouts)",
  "Witch Hunter (Bound Xbow/LA/Destro entropy)",
  "Witcher (2h/LA/Alchemy)",
  "Wizard (Enchanting/Destro/only Wands/Trait 'Wizard\'s Wardrobe')"]; 

    let segments = JSON.parse(localStorage.getItem('segments')) || [...originalSegments];
    let spinCount = parseInt(localStorage.getItem("spinCount")) || 0;
    let lastResultToRemove = localStorage.getItem("lastResult") || null;

    let angle = 0;
    let spinning = false;
    let spinVelocity = 0;
    let highlightedIndex = null;
    let highlightTimer = 0;
    let ended = false;
    let firstSpinAfterReset = false;

    counterText.textContent = "Rolls: " + spinCount;

    function saveState() {
      localStorage.setItem('segments', JSON.stringify(segments));
      localStorage.setItem('spinCount', spinCount);
      if (lastResultToRemove !== null) {
        localStorage.setItem('lastResult', lastResultToRemove);
      } else {
        localStorage.removeItem('lastResult');
      }
    }

    function wrapText(text, maxWidth, fontSize) {
      const words = text.split(' ');
      const lines = [];
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        const testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          lines.push(line.trim());
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line.trim());
      return lines;
    }

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 400;
      const numSegments = segments.length;
      if (numSegments === 0) return;
      const angleStep = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        const flicker = Math.floor(performance.now() / 250) % 2 === 0;
        ctx.fillStyle = (i === highlightedIndex) ? (flicker ? "#fff200" : "#ffd900") : `hsl(${(i * 360) / numSegments}, 80%, 60%)`;
        ctx.arc(centerX, centerY, radius, angle + i * angleStep, angle + (i + 1) * angleStep);
        ctx.fill();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + (i + 0.5) * angleStep);

        ctx.fillStyle = "#000";
        const fontSize = Math.min(18, Math.max(10, 360 / numSegments));
        ctx.font = `${fontSize}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const lines = wrapText(segments[i], radius * 0.6, fontSize);
        const lineHeight = fontSize + 2;
        const startY = -((lines.length - 1) * lineHeight) / 2;

        for (let j = 0; j < lines.length; j++) {
          ctx.fillText(lines[j], radius * 0.65, startY + j * lineHeight);
        }

        ctx.restore();
      }
    }

    function animate() {
      if (spinning) {
        angle += spinVelocity;
        spinVelocity *= 0.95;

        if (spinVelocity < 0.002) {
          spinning = false;

          if (segments.length === 0) {
            ended = true;
            spinButton.textContent = "The End";
            resetButton.style.display = "none";
            pointer.style.display = "none";
            saveState();
            return;
          }

          const numSegments = segments.length;
          const angleStep = (2 * Math.PI) / numSegments;
          let normAngle = angle % (2 * Math.PI);
          if (normAngle < 0) normAngle += 2 * Math.PI;
          const pointerAngle = 3 * Math.PI / 2;

          let diffAngle = pointerAngle - normAngle;
          if (diffAngle < 0) diffAngle += 2 * Math.PI;

          let winningIndex = Math.floor(diffAngle / angleStep) % numSegments;
          if (winningIndex < 0 || winningIndex >= numSegments) winningIndex = 0;

          const result = segments[winningIndex];
          highlightedIndex = winningIndex;
          highlightTimer = performance.now();
          lastResultToRemove = result;

          if (!firstSpinAfterReset) {
            spinCount++;
          } else {
            firstSpinAfterReset = false;
          }

          counterText.textContent = "Rolls: " + spinCount;
          resultText.textContent = "Score: " + result;
          soundSelect.play();
          saveState();

          if (segments.length === 1) {
            ended = true;
            spinButton.textContent = "The End";
            resetButton.style.display = "none";
            pointer.style.display = "none";
            saveState();
          }
        }
      }

      drawWheel();

      if (highlightedIndex !== null && performance.now() - highlightTimer > 2000) {
        highlightedIndex = null;
      }

      requestAnimationFrame(animate);
    }

    function resetAll() {
      segments = [...originalSegments];
      spinCount = 0;
      lastResultToRemove = null;
      angle = 0;
      highlightedIndex = null;
      highlightTimer = 0;
      ended = false;
      firstSpinAfterReset = true;

      endMessage.style.display = "none";
      spinButton.textContent = "Choose destiny";
      spinButton.style.display = "block";
      resetButton.style.display = "block";
      pointer.style.display = "block";
      canvas.style.display = "block";
      resultText.textContent = "Score: —";
      counterText.textContent = "Rolls: " + spinCount;

      localStorage.removeItem('segments');
      localStorage.removeItem('spinCount');
      localStorage.removeItem('lastResult');

      drawWheel();
      saveState();
    }

    spinButton.addEventListener('click', () => {
      if (spinning) return;

      if (ended) {
        endMessage.style.display = "block";
        canvas.style.display = "none";
        spinButton.style.display = "none";
        soundEnd.play();
        spinButton.disabled = true;

        setTimeout(() => {
          spinButton.disabled = false;
          endMessage.style.display = "none";
          spinButton.style.display = "block";
          canvas.style.display = "block";
          resetAll();
        }, 4000);
        return;
      }

      if (lastResultToRemove !== null) {
        const idx = segments.indexOf(lastResultToRemove);
        if (idx !== -1) {
          segments.splice(idx, 1);
          lastResultToRemove = null;
          saveState();
        }
      }

      spinVelocity = Math.random() * 0.3 + 0.3 * 2;
      spinning = true;
    });

    resetButton.addEventListener('click', resetAll);

    drawWheel();
    animate();
  </script>


</body>
</html>
