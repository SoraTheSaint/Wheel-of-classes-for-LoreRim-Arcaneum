<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel of Classes - LoreRim Arcaneum +PERMADEATH+EDITION+</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Ghastly+Panic&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Uncial+Antiqua&display=swap');
/* === GLOBAL === */
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  font-family: sans-serif;
  user-select: none;
  height: 100vh;
}



/* === WARHAMMER FANTASY HEADERS === */

.header {
  text-align: center;
  padding: 15px 20px;
  background: linear-gradient(180deg, 
    rgba(30, 20, 10, 0.95) 0%, 
    rgba(15, 10, 5, 0.98) 100%);
  border-bottom: 3px solid #8B4513;
  box-shadow: 
    0 4px 20px rgba(0, 0, 0, 0.8),
    inset 0 -2px 10px rgba(139, 69, 19, 0.3);
  position: relative;
}

/* Ozdobna linia pod headerem */
.header::after {
  content: "⚔ ✧ ⚔";
  display: block;
  font-size: 14px;
  color: #8B4513;
  letter-spacing: 15px;
  margin-top: 8px;
  opacity: 0.7;
}

h1, h2, h3, .page-title {
  font-family: 'Cinzel Decorative', 'Uncial Antiqua', serif;
  text-transform: uppercase;
  letter-spacing: 4px;
  margin: 0;
  padding: 5px 0;
  
  /* Złoto-brązowy gradient tekstu */
  background: linear-gradient(180deg, 
    #ffd700 0%, 
    #daa520 25%, 
    #b8860b 50%, 
    #8b6914 75%,
    #cd853f 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  
  /* Efekt głębi */
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9))
          drop-shadow(0 0 10px rgba(218, 165, 32, 0.3));
  
  /* Animacja subtelnego pulsowania */
  animation: headerGlow 3s ease-in-out infinite alternate;
}

@keyframes headerGlow {
  from {
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9))
            drop-shadow(0 0 8px rgba(218, 165, 32, 0.2));
  }
  to {
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9))
            drop-shadow(0 0 15px rgba(218, 165, 32, 0.5));
  }
}

h1 {
  font-size: 42px;
}

h2 {
  font-size: 32px;
}

h3 {
  font-size: 24px;
}

/* Specjalny styl dla PERMADEATH */
.header h3 span {
  font-family: 'Uncial Antiqua', serif;
  background: linear-gradient(180deg, 
    #8B0000 0%, 
    #dc143c 40%, 
    #ff4444 60%,
    #8B0000 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 8px rgba(220, 20, 60, 0.6))
          drop-shadow(0 2px 2px rgba(0, 0, 0, 0.8));
  animation: bloodPulse 2s ease-in-out infinite alternate;
  letter-spacing: 3px;
  
}

@keyframes bloodPulse {
  from {
    filter: drop-shadow(0 0 5px rgba(220, 20, 60, 0.4))
            drop-shadow(0 2px 2px rgba(0, 0, 0, 0.8));
  }
  to {
    filter: drop-shadow(0 0 15px rgba(220, 20, 60, 0.8))
            drop-shadow(0 2px 2px rgba(0, 0, 0, 0.8));
  }
}


.hidden { 
  display: none; 
}

/* === TOP BAR === */
.top-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
  flex-wrap: nowrap;
}

.top-bar > * {
  display: flex;
  align-items: center;
}

/* === MAIN BUTTONS - NOWY STYL === */
.button {
  font-size: 20px;
  padding: 10px 20px;
  border: 2px solid;
  display: block;
  align-self: flex-start;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Diablo', serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.3s ease;
}

/* CHOOSE DESTINY - zielony */
#spinButton {
  background: #0d3d0d;
  color: #90ee90;
  border-color: #28a745;
}
#spinButton:hover {
  background: #28a745;
  color: #000;
  border-color: #90ee90;
  box-shadow: 0 0 15px rgba(40, 167, 69, 0.6);
  transform: translateY(-3px);
}

/* RESET - czerwony */
#resetButton {
  background: #3d0d0d;
  color: #ff9999;
  border-color: #dc3545;
}
#resetButton:hover {
  background: #dc3545;
  color: #fff;
  border-color: #ff9999;
  box-shadow: 0 0 15px rgba(220, 53, 69, 0.6);
  transform: translateY(-3px);
}

/* CLASS TREE - srebrny/szary */
#classTreeButton {
  background: #2a2a2a;
  color: #e0e0e0;
  border-color: #888;
}
#classTreeButton:hover {
  background: #888;
  color: #000;
  border-color: #e0e0e0;
  box-shadow: 0 0 15px rgba(136, 136, 136, 0.6);
  transform: translateY(-3px);
}

/* SHUFFLE - fioletowy */
#shuffleButton {
  background: #2a1a3d;
  color: #d4b3ff;
  border-color: #6f42c1;
}
#shuffleButton:hover {
  background: #6f42c1;
  color: #fff;
  border-color: #d4b3ff;
  box-shadow: 0 0 15px rgba(111, 66, 193, 0.6);
  transform: translateY(-3px);
}

/* ACTIVE STATE - dla wszystkich */
#spinButton:active,
#resetButton:active,
#classTreeButton:active,
#shuffleButton:active {
  transform: translateY(0);
  box-shadow: none;
}

/* === WHEEL === */
.wheel-container {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 5px;
}

canvas {
  display: block;
  margin: auto;
  background-color: rgba(0, 0, 0, 0.3);
  width: min(80vw, 80vh);
  height: auto;
  aspect-ratio: 1 / 1;
}

#pointer {
  position: absolute;
  top: calc(50% - 41vh);
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 25px solid transparent;
  border-right: 25px solid transparent;
  border-top: 40px solid #e91e63;
  z-index: 15;
}

/* === FRAMES === */
.counter-frame {
  width: 175px;
  height: 50px;
  border: none;
  background: transparent;
  display: block;
  margin: 0;
  align-self: flex-start;
}

.result-frame {
  width: 500px;
  height: 150px;
  border: none;
  background: transparent;
  display: block;
  margin: 0;
  align-self: flex-start;
}

/* === HIDDEN TEXTS === */
#resultText, #counter {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}


/* === INFO ROW === */
.info-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 15px;
  margin-bottom: 10px;
  text-align: center;
}

#result {
  font-family: 'Diablo', serif;
  color: #ffcc66;
  font-size: 22px;
  text-transform: uppercase;
  background: rgba(0, 0, 0, 0.35);
  padding: 8px 20px;
  border-radius: 10px;
  border: 1px solid #b8860b;
  box-shadow: 0 0 6px #000;
}



/* === END MESSAGE === */
#endMessage {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 90%;
  text-align: center;
  font-family: 'Ghastly Panic', cursive;
  font-size: 90px;
  color: #8B0000;
  background-color: rgba(0, 0, 0, 0.8);
  font-weight: bold;
  padding: 20px;
  border-radius: 12px;
  z-index: 20;
  display: none;
  user-select: none;
}

/* === MODAL === */
.modal {
  display: none;
  position: fixed;
  top: 0; 
  left: 0;
  width: 100%; 
  height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 50;
  justify-content: center;
  align-items: center;
  font-family: 'Diablo', cursive;
}

.modal-content {
  background: #111;
  border: 2px solid #e91e63;
  border-radius: 12px;
  padding: 20px;
  color: #f1f1f1;
  max-width: 700px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
}

.modal-content h2 {
  text-align: center;
  color: #e91e63;
  margin-bottom: 10px;
  font-size: 40px;
}

.close {
  position: absolute;
  top: 10px; 
  right: 20px;
  font-size: 40px;
  color: #e91e63;
  cursor: pointer;
}

/* === CLASS DESCRIPTION LABELS === */
.skills-label,
.desc-label {
  color: #b5a779;
  font-weight: bold;
  text-transform: uppercase;
  font-size: 0.9em;
  letter-spacing: 1px;
  margin-top: 8px;
  display: inline-block;
}

.skills-value {
  color: #7fc53a;
  font-style: italic;
}

.desc-value {
  color: #d8cfa5;
}

.tree-desc strong {
  font-size: 1.2em;
  color: #ffd700;
  display: block;
  margin-bottom: 5px;
  text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
}

/* === SEARCH === */
.search-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.search-box {
  width: 70%;
  max-width: 350px;
  padding: 8px 12px;
  border: 2px solid #e91e63;
  border-radius: 6px;
  background: #111;
  color: #f1f1f1;
  font-size: 18px;
  font-family: 'Diablo';
  text-align: center;
  outline: none;
  transition: all 0.2s ease;
}

.search-box:focus {
  border-color: #ff4081;
  background: #1a1a1a;
}

.clear-btn {
  background: #222;
  color: #e91e63;
  border: 2px solid #e91e63;
  border-radius: 6px;
  font-size: 18px;
  padding: 6px 16px;
  font-family: 'Diablo';
  cursor: pointer;
  transition: all 0.2s ease;
}

.clear-btn:hover {
  background: #e91e63;
  color: #111;
}

/* === CLASS TREE OVERLAY === */
.class-tree-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 10, 15, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  backdrop-filter: blur(4px);
}

.class-tree-overlay.hidden {
  display: none;
}

/* === CLASS TREE POPUP === */
.class-tree-popup {
  background: rgba(20, 20, 25, 0.92);
  border: 2px solid #88867c;
  border-radius: 10px;
  padding: 20px;
  width: 70%;
  max-width: 900px;
  margin: 50px auto;
  box-shadow: 0 0 25px rgba(130,130,130,0.3);
  backdrop-filter: blur(6px);
  color: #d2c8b8;
  font-family: "Trajan Pro", "Cinzel", serif;
  text-shadow: 0 0 4px #000;
  animation: popupFade 0.35s ease-out;
}

@keyframes popupFade {
  0% {
    opacity: 0;
    transform: scale(0.8);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

.class-tree-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  margin-bottom: 10px;
  padding-bottom: 5px;
}

.class-tree-header h2 {
  font-family: "Cinzel Decorative", serif;
  font-size: 1.6rem;
  color: #b5a779;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin: 0;
}

.class-tree-close {
  background: transparent;
  border: 1px solid #777;
  color: #b5a779;
  font-size: 1.4rem;
  padding: 2px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}

.class-tree-close:hover {
  background: rgba(181,167,121,0.2);
  color: #fff3c6;
}

.class-tree-body {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  padding: 10px 20px;
}

.class-tree-left {
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 0 0 180px;
}

.class-tree-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* === TREE MAIN BUTTONS === */
.tree-main-btn {
  border-radius: 8px;
  padding: 10px 0;
  font-family: 'Diablo', serif;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: 0.3s;
  font-size: 16px;
}

.tree-main-btn:hover {
  background: #c8b66d;
  color: #1b1a17;
}

.tree-main-btn.active {
  background: #c6b56b;
  color: #1a1a1a;
  box-shadow: 0 0 10px #d7c979;
}

/* === TREE CONTENT === */
.tree-content {
  min-height: 160px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 12px;
  background: rgba(20,20,20,0.85);
  overflow-y: auto;
}

/* === TREE NODES === */
.tree-node {
  font-family: "Diablo", serif;
  color: #d2c8b8;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 6px 10px;
  margin: 4px 0;
  border: 1px solid rgba(170, 170, 170, 0.25);
  border-radius: 4px;
  background: rgba(50, 50, 55, 0.45);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  min-width: 140px;
}

.tree-node:hover {
  background: rgba(130,130,140,0.3);
  color: #f2eedc;
  text-shadow: 0 0 4px #a89d7a;
  transform: scale(1.02);
}

.tree-node.selected {
  border-color: #b5a779;
  background: rgba(181,167,121,0.25);
  color: #f2eedc;
}

.tree-node.final {
  border-color: #ffcc33;
  color: #ffeb99;
}

/* === TREE CHILDREN === */
.tree-children {
  margin-left: 22px;
  border-left: 1px solid rgba(255,255,255,0.1);
  padding-left: 10px;
  display: none;
}

.tree-children.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { 
    opacity: 0; 
    transform: translateY(-5px); 
  }
  to { 
    opacity: 1; 
    transform: translateY(0); 
  }
}

/* === TREE DESCRIPTION === */
.tree-desc {
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  background: rgba(10,10,10,0.9);
  padding: 15px;
  color: #d8cfa5;
  font-family: 'Diablo', serif;
  font-size: 15px;
  min-height: 80px;
  text-align: left;
  text-transform: uppercase;
}

.class-desc-box {
  background: rgba(25, 25, 30, 0.85);
  border: 1px solid rgba(200,200,200,0.2);
  border-radius: 6px;
  padding: 10px 15px;
  margin-top: 15px;
  color: #d2c8b8;
  font-family: "Cinzel", serif;
  min-height: 80px;
  text-align: center;
  transition: all 0.3s ease-in-out;
  box-shadow: 0 0 12px rgba(181,167,121,0.1);
}

.class-desc-box:hover {
  background: rgba(0, 0, 0, 0.85);
  box-shadow: 0 0 25px rgba(177, 163, 44, 0.6);
}

.class-desc-box strong {
  color: #e6dcab;
  font-size: 1.1rem;
}

.class-desc-box em {
  color: #b1a32c;
  text-shadow: 0 0 5px rgba(177, 163, 44, 0.3);
}

.class-desc-box p {
  font-size: 0.95em;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
  color: #f1d97a;
}

.class-desc-box q {
  display: block;
  margin-top: 8px;
  font-style: italic;
  color: #ffcc66;
  text-shadow: 0 0 6px rgba(255, 204, 102, 0.4);
}

/* === TREE COLOR VARIANTS === */

/* MAGICKA - niebieski */
.tree-main-btn[data-tree="Magicka"] {
  background: #0b3d91;
  color: #a8c8ff;
  border-color: #5b7fff;
}
.tree-main-btn[data-tree="Magicka"]:hover,
.tree-main-btn[data-tree="Magicka"].active {
  background: #5b7fff;
  color: #ffffff;
  border-color: #a8c8ff;
  box-shadow: 0 0 12px rgba(91, 127, 255, 0.6);
}

/* HEALTH - czerwony */
.tree-main-btn[data-tree="Health"] {
  background: #5c1a1a;
  color: #ffb3b3;
  border-color: #c53a2e;
}
.tree-main-btn[data-tree="Health"]:hover,
.tree-main-btn[data-tree="Health"].active {
  background: #c53a2e;
  color: #fff;
  border-color: #ffb3b3;
  box-shadow: 0 0 12px rgba(197, 58, 46, 0.6);
}

/* STAMINA - zielony */
.tree-main-btn[data-tree="Stamina"] {
  background: #1a3d1a;
  color: #b3ffb3;
  border-color: #7fc53a;
}
.tree-main-btn[data-tree="Stamina"]:hover,
.tree-main-btn[data-tree="Stamina"].active {
  background: #7fc53a;
  color: #fff;
  border-color: #b3ffb3;
  box-shadow: 0 0 12px rgba(127, 197, 58, 0.6);
}

/* DEITY - złoty */
.tree-main-btn[data-tree="Deity"] {
  background: #3d3a1a;
  color: #fff7c2;
  border-color: #d5c773;
}
.tree-main-btn[data-tree="Deity"]:hover,
.tree-main-btn[data-tree="Deity"].active {
  background: #d5c773;
  color: #000;
  border-color: #fff7c2;
  box-shadow: 0 0 12px rgba(213, 199, 115, 0.6);
}

#magickaTree .tree-node { border-color: #5b7fff; }
#healthTree .tree-node { border-color: #c53a2e; }
#staminaTree .tree-node { border-color: #7fc53a; }
#deityTree .tree-node { border-color: #d5c773; }

#magickaTree .tree-node:hover { background: #5b7fff; color: #000; }
#healthTree .tree-node:hover { background: #c53a2e; color: #fff; }
#staminaTree .tree-node:hover { background: #7fc53a; color: #000; }
#deityTree .tree-node:hover { background: #d5c773; color: #000; }

/* === MOBILE RESPONSIVE === */
@media (max-width: 768px) {
  .top-bar {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
    width: 100%;
    text-align: center;
  }

  .button {
    display: block;
    font-size: 14px;
    padding: 6px 14px;
    width: 70%;
    max-width: 220px;
    text-align: center;
    margin: 0 auto;
  }

  .header {
  padding: 10px 15px;
  }
  
  .header::after {
    font-size: 10px;
    letter-spacing: 10px;
    margin-top: 5px;
  }

  h1, h2, h3, .page-title {
    font-size: 16px !important;
    letter-spacing: 2px;
  }

  h1 { font-size: 24px !important; }
  h2 { font-size: 20px !important; }
  h3 { font-size: 16px !important; }

  .counter-frame {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 400px;
    height: 75px;
    text-align: center;
    margin: 0 auto;
  }

  .result-frame {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 90%;
    max-width: 400px;
    height: 100px;
    text-align: center;
    margin: 0 auto;
  }

  .wheel-container {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: 15px;
  }

  canvas {
    width: min(90vw, 90vh);
    height: auto;
    aspect-ratio: 1 / 1;
    margin-top: 10px;
  }

  #pointer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, calc(-50% - 45vw));
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 25px solid #e91e63;
    z-index: 10;
  }

  #endMessage {
    font-size: 32px;
    padding: 8px;
    max-width: 90%;
  }

  /* CLASS TREE MOBILE */
  .class-tree-popup {
    width: 94vw !important;
    height: 92vh !important;
    padding: 10px !important;
    border-radius: 8px;
    box-sizing: border-box;
  }

  .class-tree-header {
    padding: 6px 8px !important;
    margin-bottom: 6px !important;
  }

  .class-tree-header h2 {
    font-size: 1rem !important;
    letter-spacing: 1px;
    margin: 0;
  }

  .class-tree-close {
    width: 30px;
    height: 30px;
    font-size: 18px;
  }

  .class-tree-body {
    flex-direction: column;
    gap: 10px;
    padding: 6px;
  }

  .class-tree-left {
    flex: none;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }

  .tree-main-btn {
    padding: 6px 12px;
    font-size: 12px;
  }

  .class-tree-right {
    max-height: calc(92vh - 150px);
    overflow-y: auto;
  }

  .tree-node {
    width: 100% !important;

  function wrapText(text, maxWidth, fontSize) {
  // Rozdziel po spacji i po ukośniku
  const words = text.split(/([ /])/); // zachowuje spacje i ukośniki jako osobne elementy
  const lines = [];
  let line = '';
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n];
    const metrics = ctx.measureText(testLine);
    const testWidth = metrics.width;
    if (testWidth > maxWidth && n > 0 && words[n] !== ' ' && words[n] !== '/') {
      lines.push(line.trim());
      line = words[n];
    } else {
      line = testLine;
    }
  }
  lines.push(line.trim());
  return lines;
}

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 400;
      const numSegments = segments.length;
      if (numSegments === 0) return;
      const angleStep = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
  ctx.beginPath();
  ctx.moveTo(centerX, centerY);
  const flicker = Math.floor(performance.now() / 250) % 2 === 0;

  // 🔹 trzy odcienie czerwieni: krwisty, mocny i jasny
  const shade = i % 3 === 0 ? 35     // ciemnoczerwony (krwisty)
              : i % 3 === 1 ? 45     // średni czerwony
              : 55;                  // jaśniejszy, stonowany czerwony

  ctx.fillStyle = (i === highlightedIndex)
    ? (flicker ? "#fff200" : "#ffd900")   // efekt migania wygranego segmentu
    : `hsl(0, 80%, ${shade}%)`;           // różne odcienie czerwieni

  ctx.arc(centerX, centerY, radius, angle + i * angleStep, angle + (i + 1) * angleStep);
  ctx.fill();

  // 🔹 ciemna linia między segmentami
  ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
  ctx.lineWidth = 2;
  ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + (i + 0.5) * angleStep);

        ctx.fillStyle = "#000";
let fontSize;
if (window.innerWidth <= 768) {
  fontSize = Math.min(26, Math.max(14, 360 / numSegments)); // mobile: jeszcze większy tekst
} else {
  fontSize = Math.min(24, Math.max(12, 360 / numSegments)); // PC: duży tekst
}
ctx.font = `${fontSize}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

         // WYŚWIETL TYLKO NAZWĘ KLASY (przed pierwszym nawiasem)
  let className = segments[i];
  const match = className.match(/^([^(]+)\s*(\(.*\))?/);
  if (match) className = match[1].trim();


        // Popraw TUTAJ: przekazuj className do wrapText!
const lines = wrapText(className, radius * 0.55, fontSize); // było 0.6
const lineHeight = fontSize + 2;
const startY = -((lines.length - 1) * lineHeight) / 2;

        for (let j = 0; j < lines.length; j++) {
          ctx.fillText(lines[j], radius * 0.75, startY + j * lineHeight);
        }

        ctx.restore();
      }
    }

    function animate() {
      if (spinning) {
        angle += spinVelocity;
        spinVelocity *= 0.95;

        if (spinVelocity < 0.002) {
          spinning = false;

          if (segments.length === 0) {
            ended = true;
            spinButton.textContent = "The End";
            resetButton.style.display = "none";
            pointer.style.display = "none";
            saveState();
            return;
          }

          const numSegments = segments.length;
          const angleStep = (2 * Math.PI) / numSegments;
          let normAngle = angle % (2 * Math.PI);
          if (normAngle < 0) normAngle += 2 * Math.PI;
          const pointerAngle = 3 * Math.PI / 2;

          let diffAngle = pointerAngle - normAngle;
          if (diffAngle < 0) diffAngle += 2 * Math.PI;

          let winningIndex = Math.floor(diffAngle / angleStep) % numSegments;
          if (winningIndex < 0 || winningIndex >= numSegments) winningIndex = 0;

          const result = segments[winningIndex];
          highlightedIndex = winningIndex;
          highlightTimer = performance.now();
          lastResultToRemove = result;

          counterText.textContent = "Rolls: " + spinCount;
          resultText.textContent = "Score: " + result;
          soundSelect.play();
          saveState();

          if (segments.length === 1) {
            ended = true;
            spinButton.textContent = "The End";
            resetButton.style.display = "none";
            pointer.style.display = "none";
            saveState();
          }
        }
      }

      drawWheel();

      if (highlightedIndex !== null && performance.now() - highlightTimer > 2000) {
        highlightedIndex = null;
      }

      requestAnimationFrame(animate);
    }

  for (let i = array.length - 1; i > 0; i--) {

    [array[i], array[j]] = [array[j], array[i]];

}

// === CLASS TREE INTERAKTYWNY POP-UP ===
function renderExpandableTree(container, branch) {
  const descBox = document.getElementById("classDesc");
  if (descBox && !descBox.textContent.trim()) {
    descBox.innerHTML = "<em>Select a class to view its description.</em>";
  }
  
  for (const [name, data] of Object.entries(branch)) {
    const node = document.createElement("div");
    node.classList.add("tree-node");
    node.textContent = name;

    const children = document.createElement("div");
    children.classList.add("tree-children");

    node.addEventListener("click", (e) => {
      e.stopPropagation();

      // === Pokazanie opisu klasy po kliknięciu ===
      const descBox = document.getElementById("classDesc");
      if (descBox) {
        let content = `<strong>${name}</strong>`;
        
        // Dodaj skills jeśli istnieją
        if (data.skills) {
          content += `<br><span class="skills-label">Skills:</span> <span class="skills-value">${data.skills}</span>`;
        }
        
        // Dodaj opis
        if (data.desc) {
          content += `<br><span class="desc-label">Description:</span> <span class="desc-value">${data.desc}</span>`;
        }
        
        descBox.innerHTML = content;
      }

      // === Rozwijanie drzewa ===
      const expanded = children.classList.toggle("active");
      if (expanded && data.evolves) {
        children.innerHTML = "";
        renderExpandableTree(children, data.evolves);
      } else {
        children.innerHTML = "";
      }
    });

    container.appendChild(node);
    container.appendChild(children);
  }
}


// === PRZYCISKI OTWIERANIA I OBSŁUGA CLASS TREE ===
const openBtn = document.getElementById("classTreeButton");
const overlay = document.getElementById("classTreeOverlay");
const closeBtn = document.getElementById("closeClassTree");
const container = document.getElementById("classTreeContainer");
const descBox = document.getElementById("classDesc");

// Otwórz okno drzewa
openBtn.addEventListener("click", () => {
  overlay.classList.remove("hidden");
  container.innerHTML = "";
  descBox.innerHTML = "<em>Select a class to see its description...</em>";
});

// Zamknij
closeBtn.addEventListener("click", () => {
  overlay.classList.add("hidden");
});

// Kliknięcie w tło zamyka popup
overlay.addEventListener("click", (e) => {
  if (e.target === overlay) overlay.classList.add("hidden");
});

// === GŁÓWNE PRZYCISKI (Magicka / Health / Stamina / Deity) ===
document.querySelectorAll(".tree-main-btn").forEach(btn => {
  btn.addEventListener("click", (e) => {
    const key = e.target.dataset.tree;
    container.innerHTML = ""; // czyścimy poprzedni widok

    // 🔹 Ustaw ID kontenera na podstawie kategorii (dla kolorów CSS)
    container.id = key.toLowerCase() + "Tree"; // np. "magickaTree"

    if (classTree[key] && classTree[key].evolves) {
      renderExpandableTree(container, classTree[key].evolves);

      // ustaw opis głównej kategorii
      descBox.innerHTML = `<strong>${key}</strong><br>${classTree[key].desc}`;
    }

    // podświetlenie aktywnego przycisku
    document.querySelectorAll(".tree-main-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
  });
});
