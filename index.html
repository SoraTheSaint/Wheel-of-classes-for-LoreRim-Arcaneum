<html lang="pl">
<head>
  <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
  @import url('https://fonts.googleapis.com/css2?family=Ghastly+Panic&display=swap');

  html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
      height: 100vh;
    }

.header {
  text-align: Center;
  border-bottom: 3px;
  color: white;
  font-size: 24px;
}

#pointer {
  position: absolute;
  top: 5px; /* nad kołem */
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 25px solid transparent;
  border-right: 25px solid transparent;
  border-top: 40px solid #e91e63;
  z-index: 15;
}


.top-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
  flex-wrap: nowrap; /* na PC zawsze w jednej linii */
}

.top-bar > * {
  display: flex;
  align-items: center;       /* sprawia że tekst/iframe trzyma się linii */
}


/* kontener koła */
.wheel-container {
  position: relative;
  margin-top: -40px;
  display: flex;
  justify-content: center;
  align-items: center;
}

    canvas {
  display: block;
  margin: auto;
  background-color: rgba(0, 0, 0, 0.3);
  width: 900px;   /* PC: sztywne */
  height: 900px;
}

    /* Przyciski */
.button {
  font-size: 20px;
  padding: 10px 20px;
  border: none;
  display: block;
  align-self: flex-start;
  border-radius: 8px;
  cursor: pointer;
  color: white;
}
    #spinButton { background-color: #28a745; }
    #resetButton { background-color: #dc3545; }

    .counter-frame{
    width: 175px;
    height: 40px;   /* było 120px – obniżamy */
     border: none;
  background: transparent;
  display: block;        /* blok zamiast inline */
  margin: 0;             /* usuń centrowanie */
  align-self: flex-start; /* wyrównaj do góry */
}
   .result-frame
   {
    width: 500px;
    height: 150px;   /* było 120px – obniżamy */
     border: none;
  background: transparent;
  display: block;        /* blok zamiast inline */
  margin: 0;             /* usuń centrowanie */
  align-self: flex-start; /* wyrównaj do góry */
}
    /* Teksty ukryte wewnętrzne */
    #resultText, #counter {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #endMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 90%;
      text-align: center;
      font-family: 'Ghastly Panic', cursive;
      font-size: 90px;
      color: #8B0000;
      background-color: rgba(0, 0, 0, 0.8);
      font-weight: bold;
      padding: 20px;
      border-radius: 12px;
      z-index: 20;
      display: none;
      user-select: none;
    }

    /* --- MOBILE --- */
@media (max-width: 768px) {
  .top-bar {
    flex-direction: column;   
    align-items: center;      
    gap: 10px;
    margin-top: 10px;
  }

  .button {
    width: 100%;
    
    text-align: center;
  }

  /* Counter iframe – niski i wyśrodkowany */
  .counter-frame {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    
    height: 60px;         /* niski prostokąt */
    text-align: center;
  }

  /* Result iframe – trochę wyższy */
  .result-frame {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    
    height: 120px;        /* większy prostokąt na klasę */
    text-align: center;
  }

  .wheel-container {
    flex-direction: column;
    align-items: center;
    margin-top: 15px;
  }

  canvas {
    width: 90vw;
    height: 90vw;
    margin-top: 10px;
  }

  #pointer {
    position: absolute;   
    top: 0;
    margin-bottom: 5px;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 25px solid #e91e63;
  }
  #endMessage {
    font-size: 36px; /* mniejszy rozmiar na mobile */
    padding: 10px;
  }
}



  </style>

</head>
<body>

  <iframe src="result.html" class="result-frame"></iframe>
</div>

  <div class="wheel-container">

</div>

  <script>

    const endMessage = document.getElementById('endMessage');

    const soundSelect = document.getElementById('soundSelect');
    const soundEnd = document.getElementById('soundEnd');

    const originalSegments = [

      "Swift Guardian (Light Armor/1h sword/Block)",

      "Sith (1h/Destro Lightning/Alteration)",
      "Sniper (Heavy Bow/LA)",
      "Spellbreaker (Heavy Armor/Alteration/1H + Shield/No Enchanting)",
      "Spellforged Knight (Heavy Armor/Enchanting trait/1H + Shield)",
      "Spiritcaller (Spirit conjuration)",
      "Spiritstalker (LA/Bow/Spirit conjuration)",
      "Stendar Zealot (2H/Unarmored/Block)",
      "Stormsinger (Shouts/Illusion/Lightning Destro)",
      "Taming Master (LA/Wayfarer <Taming Perk>/Trait 'Percussive Maintenance'/1h Spear)",
      "Temple Drunkard (Heavy armor/Greatsword/Alchemy)",
      "The Bard (Speech/Alteration Sounds/Illusion/1H/Trait 'Acoustic Arcanist'/Trait 'Fatal Attraction')",
      "The Hooked One (Argonian/1H/Enchanting/LA/trait 'Angler'/Trait 'Swimmer')",
      "The Profaned Monk of Sheogorath (Unarmored/Blight Fists/Entropy/Sheogorath deity)",
      "Thornscale Saint of Arkay (Argonian/Alteration Transmutation/Restoration Heal/Heavy Armor/Deity Arkay)",
      "Totem Reaver (Light Armor/1h Mace/Triumvirate Totems/Alteration)",
      "Veteran of the Forge (Smithing/1h Mace/HA/Deity Zenithar)",
      "Voicebreaker (HA/Warhammer/Shouts)",
      "Vigilant Exorcist (HA/Mace/Restoration Turn Undead)",
      "Wardstriker (Light armor/1h Daggers/Restoration Wards)",
      "Witch Hunter (Bound Xbow/LA/Destro Entropy)",
      "Witcher (2h/LA/Alchemy)",
      "Wizard (Enchanting/Destro/only Wands/Trait 'Wizard's Wardrobe')",
      "Warlock (Destruction/Conjuration/Illusion)",
      "Wyrdsinger (Light Armor/Staff/Illusion/Speech Bard)",
      "Wyrmcaller (Shouts/Light Armor/Conjuration Spirit)"]; 

    let segments = JSON.parse(localStorage.getItem('segments')) || [...originalSegments];
    let spinCount = parseInt(localStorage.getItem("spinCount")) || 0;
    let lastResultToRemove = localStorage.getItem("lastResult") || null;

    let angle = 0;
    let spinning = false;
    let spinVelocity = 0;
    let highlightedIndex = null;
    let highlightTimer = 0;
    let ended = false;
    let firstSpinAfterReset = false;

    counterText.textContent = "Rolls: " + spinCount;

    function saveState() {
      localStorage.setItem('segments', JSON.stringify(segments));
      localStorage.setItem('spinCount', spinCount);
      if (lastResultToRemove !== null) {
        localStorage.setItem('lastResult', lastResultToRemove);
      } else {
        localStorage.removeItem('lastResult');
      }
    }

  function wrapText(text, maxWidth, fontSize) {
  // Rozdziel po spacji i po ukośniku
  const words = text.split(/([ /])/); // zachowuje spacje i ukośniki jako osobne elementy
  const lines = [];
  let line = '';
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n];
    const metrics = ctx.measureText(testLine);
    const testWidth = metrics.width;
    if (testWidth > maxWidth && n > 0 && words[n] !== ' ' && words[n] !== '/') {
      lines.push(line.trim());
      line = words[n];
    } else {
      line = testLine;
    }
  }
  lines.push(line.trim());
  return lines;
}

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 400;
      const numSegments = segments.length;
      if (numSegments === 0) return;
      const angleStep = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        const flicker = Math.floor(performance.now() / 250) % 2 === 0;
        ctx.fillStyle = (i === highlightedIndex)
  ? (flicker ? "#fff200" : "#ffd900")
  : `hsl(0, 60%, ${50 + (i % 2) * 10}%)`; // stonowany czerwony
        ctx.arc(centerX, centerY, radius, angle + i * angleStep, angle + (i + 1) * angleStep);
        ctx.fill();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + (i + 0.5) * angleStep);

        ctx.fillStyle = "#000";
let fontSize;
if (window.innerWidth <= 768) {
  fontSize = Math.min(26, Math.max(14, 360 / numSegments)); // mobile: jeszcze większy tekst
} else {
  fontSize = Math.min(24, Math.max(12, 360 / numSegments)); // PC: duży tekst
}
ctx.font = `${fontSize}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

         // WYŚWIETL TYLKO NAZWĘ KLASY (przed pierwszym nawiasem)
  let className = segments[i];
  const match = className.match(/^([^(]+)\s*(\(.*\))?/);
  if (match) className = match[1].trim();


        // Popraw TUTAJ: przekazuj className do wrapText!
const lines = wrapText(className, radius * 0.55, fontSize); // było 0.6
const lineHeight = fontSize + 2;
const startY = -((lines.length - 1) * lineHeight) / 2;

        for (let j = 0; j < lines.length; j++) {
          ctx.fillText(lines[j], radius * 0.75, startY + j * lineHeight);
        }

        ctx.restore();
      }
    }

    function animate() {
      if (spinning) {
        angle += spinVelocity;
        spinVelocity *= 0.95;

        if (spinVelocity < 0.002) {
          spinning = false;

          if (segments.length === 0) {
            ended = true;
            spinButton.textContent = "The End";
            resetButton.style.display = "none";
            pointer.style.display = "none";
            saveState();
            return;
          }

          const numSegments = segments.length;
          const angleStep = (2 * Math.PI) / numSegments;
          let normAngle = angle % (2 * Math.PI);
          if (normAngle < 0) normAngle += 2 * Math.PI;
          const pointerAngle = 3 * Math.PI / 2;

          let diffAngle = pointerAngle - normAngle;
          if (diffAngle < 0) diffAngle += 2 * Math.PI;

          let winningIndex = Math.floor(diffAngle / angleStep) % numSegments;
          if (winningIndex < 0 || winningIndex >= numSegments) winningIndex = 0;

          const result = segments[winningIndex];
          highlightedIndex = winningIndex;
          highlightTimer = performance.now();
          lastResultToRemove = result;

          counterText.textContent = "Rolls: " + spinCount;
          resultText.textContent = "Score: " + result;
          soundSelect.play();
          saveState();

          if (segments.length === 1) {
            ended = true;
            spinButton.textContent = "The End";
            resetButton.style.display = "none";
            pointer.style.display = "none";
            saveState();
          }
        }
      }

      drawWheel();

      if (highlightedIndex !== null && performance.now() - highlightTimer > 2000) {
        highlightedIndex = null;
      }

      requestAnimationFrame(animate);
    }

    function resetAll() {
      segments = [...originalSegments];
      spinCount = 0;
      lastResultToRemove = null;
      angle = 0;
      highlightedIndex = null;
      highlightTimer = 0;
      ended = false;
  
      endMessage.style.display = "none";
      spinButton.textContent = "Choose destiny";
      spinButton.style.display = "block";
      resetButton.style.display = "block";
      pointer.style.display = "block";
      canvas.style.display = "block";
      resultText.textContent = "Score: —";
      counterText.textContent = "Rolls: " + spinCount;

      localStorage.removeItem('segments');
      localStorage.removeItem('spinCount');
      localStorage.removeItem('lastResult');

      drawWheel();
      saveState();
    }

   spinButton.addEventListener('click', () => {
  if (spinning) return;

 
  if (lastResultToRemove !== null) {
    const idx = segments.indexOf(lastResultToRemove);
    if (idx !== -1) {
      segments.splice(idx, 1);

      // TYLKO inkrementuj spinCount, jeśli segment został usunięty i NIE jest to koniec gry
      if (segments.length > 0) {
        spinCount++;
        counterText.textContent = "Rolls: " + spinCount;
      }
    }
    lastResultToRemove = null;
    saveState();
  }

 
  if (segments.length === 0 || ended) {
    ended = true;
    spinButton.textContent = "The End";
    resetButton.style.display = "none";
    pointer.style.display = "none";

    
    endMessage.style.display = "block";
    canvas.style.display = "none";
    soundEnd.play();
    spinButton.style.display = "none";
    spinButton.disabled = true;
    setTimeout(() => {
      spinButton.disabled = false;
      endMessage.style.display = "none";
      spinButton.style.display = "block";
      canvas.style.display = "block";
      resetAll();
    }, 4000);
    return;
  }


  spinVelocity = Math.random() * 0.3 + 0.3 * 2;
  spinning = true;
});


    resetButton.addEventListener('click', resetAll);

    drawWheel();
    animate();
  </script>
