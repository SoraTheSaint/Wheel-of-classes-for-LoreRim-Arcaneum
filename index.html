<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel of Classes - LoreRim Arcaneum +PERMADEATH+EDITION+</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Ghastly+Panic&display=swap');

  html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
      height: 100vh;
    }

.header {
  text-align: Center;
  border-bottom: 3px;
  color: white;
  font-size: 24px;
}
#pointer {
  position: absolute;
  top: calc(50% - 41vh); /* dopasowanie pionowe względem koła */
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 25px solid transparent;
  border-right: 25px solid transparent;
  border-top: 40px solid #e91e63;
  z-index: 15;
}


.top-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
  flex-wrap: nowrap; /* na PC zawsze w jednej linii */
}

.top-bar > * {
  display: flex;
  align-items: center;       /* sprawia że tekst/iframe trzyma się linii */
}


.wheel-container {
  position: relative; /* Upewnij się, że to jest ustawione */
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 5px;
}

    canvas {
  display: block;
  margin: auto;
  background-color: rgba(0, 0, 0, 0.3);
  width: min(80vw, 80vh);  /* szerokość = 80% szerokości lub wysokości ekranu */
  height: auto;
  aspect-ratio: 1 / 1;     /* zawsze kwadrat */
}


    /* Przyciski */
.button {
  font-size: 20px;
  padding: 10px 20px;
  border: none;
  display: block;
  align-self: flex-start;
  border-radius: 8px;
  cursor: pointer;
  color: white;
}
    #spinButton { background-color: #28a745;}
    #spinButton:hover { background-color: #45c261;}
    #resetButton { background-color: #dc3545;}
    #resetButton:hover { background-color: #e91e63;}
    #shuffleButton { background-color: #6f42c1;}
    #shuffleButton:hover { background-color: #8e5ef7;}
    #compendiumButton { background-color: #b1a32c;}
    #compendiumButton:hover { background-color: #c8b53c;} 

    
/* delikatne podświetlenie i unoszenie */
#spinButton:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 18px rgba(0,0,0,0.35);
  opacity: 0.98;
}

#resetButton:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.28);
  opacity: 0.98;
}

#shuffleButton:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.28);
  opacity: 0.98;
}

#compendiumButton:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.28);
  opacity: 0.98;
}

/* opcjonalnie :active (kliknięcie) */
#spinButton:active, #resetButton:active, #shuffleButton:active, #compendiumButton:active {
  transform: translateY(0);
  box-shadow: none;
}

    .counter-frame{
    width: 175px;
    height: 40px;   /* było 120px – obniżamy */
     border: none;
  background: transparent;
  display: block;        /* blok zamiast inline */
  margin: 0;             /* usuń centrowanie */
  align-self: flex-start; /* wyrównaj do góry */
}
   .result-frame
   {
    width: 500px;
    height: 150px;   /* było 120px – obniżamy */
     border: none;
  background: transparent;
  display: block;        /* blok zamiast inline */
  margin: 0;             /* usuń centrowanie */
  align-self: flex-start; /* wyrównaj do góry */
}
    /* Teksty ukryte wewnętrzne */
    #resultText, #counter {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #endMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 90%;
      text-align: center;
      font-family: 'Ghastly Panic', cursive;
      font-size: 90px;
      color: #8B0000;
      background-color: rgba(0, 0, 0, 0.8);
      font-weight: bold;
      padding: 20px;
      border-radius: 12px;
      z-index: 20;
      display: none;
      user-select: none;
    }

    /* MODAL */
    .modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 50;
  justify-content: center;
  align-items: center;
  font-family: 'Diablo', cursive;
}

.search-box {
  width: 70%;
  max-width: 350px;
  padding: 8px 12px;
  border: 2px solid #e91e63;
  border-radius: 6px;
  background: #111;
  color: #f1f1f1;
  font-size: 18px;
  font-family: 'Diablo';
  text-align: center;
  outline: none;
  transition: all 0.2s ease;
}

.search-box:focus {
  border-color: #ff4081;
  background: #1a1a1a;
}

.clear-btn {
  background: #222;
  color: #e91e63;
  border: 2px solid #e91e63;
  border-radius: 6px;
  font-size: 18px;
  padding: 6px 16px;
  font-family: 'Diablo';
  cursor: pointer;
  transition: all 0.2s ease;
}

.clear-btn:hover {
  background: #e91e63;
  color: #111;
}

.search-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.modal-content {
  background: #111;
  border: 2px solid #e91e63;
  border-radius: 12px;
  padding: 20px;
  color: #f1f1f1;
  max-width: 700px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
}

.modal-content h2 {
  text-align: center;
  color: #e91e63;
  margin-bottom: 10px;
  font-size: 40px;
}

.close {
  position: absolute;
  top: 10px; right: 20px;
  font-size: 40px;
  color: #e91e63;
  cursor: pointer;
}

.category-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 15px;
}

/* kolory frakcji według nowych kluczy */
.cat-btn {
  font-family: 'Diablo', serif;
  font-size: 18px;
  border: 2px solid #c0392b;
  color: #c0392b;
  background: none;
  padding: 8px 16px;
  border-radius: 10px;
  transition: background 180ms ease, color 180ms ease, transform 120ms ease, box-shadow 180ms ease;
  cursor: pointer;
}

/* --------------------- KOLORY KATEGORII --------------------- */

/* ARKANA – błękit magii */
.cat-btn[data-cat*="ARCANE"] {
  background: #0b3d91;
  color: #ffecb3;
  border-color: #4f7eea;
}
.cat-btn[data-cat*="ARCANE"].active {
  background: none;
  color: #0b3d91;
  border-color: #ffecb3;
  text-shadow: 0 0 8px #4f7eea;
}

/* WOJOWNICY – ognisty czerwono-pomarańczowy */
.cat-btn[data-cat*="WARRIOR"], .cat-btn[data-cat*="LEGION"] {
  background: #8b2f12;
  color: #ffe6d6;
  border-color: #ff6f3c;
}
.cat-btn[data-cat*="WARRIOR"].active, .cat-btn[data-cat*="LEGION"].active {
  background: none;
  color: #ff6f3c;
  border-color: #ffe6d6;
  text-shadow: 0 0 8px #ff6f3c;
}

/* HYBRID ASCENDANTS – stalowo-niebieski z nutą zieleni */
.cat-btn[data-cat*="HYBRID"], .cat-btn[data-cat*="ASCENDANT"] {
  background: #1e3b3f;
  color: #c9f0ff;
  border-color: #4dc9ff;
}
.cat-btn[data-cat*="HYBRID"].active, .cat-btn[data-cat*="ASCENDANT"].active {
  background: none;
  color: #4dc9ff;
  border-color: #c9f0ff;
  text-shadow: 0 0 8px #4dc9ff;
}

/* SHADOW COVENS – mroczny fiolet */
.cat-btn[data-cat*="SHADOW"], .cat-btn[data-cat*="COVEN"] {
  background: #331a66;
  color: #e9ddff;
  border-color: #8a6eff;
}
.cat-btn[data-cat*="SHADOW"].active, .cat-btn[data-cat*="COVEN"].active {
  background: none;
  color: #8a6eff;
  border-color: #e9ddff;
  text-shadow: 0 0 8px #8a6eff;
}

/* DIVINE CALLINGS – złoto-święty */
.cat-btn[data-cat*="DIVINE"], .cat-btn[data-cat*="CALLING"] {
  background: #5a561a;
  color: #fff7c2;
  border-color: #f1e16b;
}
.cat-btn[data-cat*="DIVINE"].active, .cat-btn[data-cat*="CALLING"].active {
  background: none;
  color: #f1e16b;
  border-color: #fff7c2;
  text-shadow: 0 0 8px #f1e16b;
}

/* CURSED ONES – blight/brązowy zgnilizny */
.cat-btn[data-cat*="CURSED"], .cat-btn[data-cat*="BLIGHTED"], .cat-btn[data-cat*="CURSE"] {
  background: #3b1f0f;
  color: #ffd7c9;
  border-color: #b7410e;
}
.cat-btn[data-cat*="CURSED"].active, .cat-btn[data-cat*="BLIGHTED"].active, .cat-btn[data-cat*="CURSE"].active {
  background: none;
  color: #b7410e;
  border-color: #ffd7c9;
  text-shadow: 0 0 8px #b7410e;
}

/* MORTAL OUTCASTS – stalowy, szarawy */
.cat-btn[data-cat*="MORTAL"], .cat-btn[data-cat*="OUTCAST"] {
  background: #2b2b2b;
  color: #e0e0e0;
  border-color: #888;
}
.cat-btn[data-cat*="MORTAL"].active, .cat-btn[data-cat*="OUTCAST"].active {
  background: none;
  color: #bbb;
  border-color: #e0e0e0;
  text-shadow: 0 0 8px #bbb;
}


/* wygląd po hover */
.cat-btn:hover {
  color: #fff;
  background: rgba(192, 57, 43, 0.15);
  border-color: #fff;
  transform: translateY(-2px);
  filter: brightness(1.05);
}

/* aktywny odwrotny kolor */
.cat-btn.active {
  color: #fff;
  border-color: #fff;
  background: none;
  text-shadow: 0 0 8px #ff3b3b;
}

/* Odwrócenie kolorów według frakcji */
.cat-btn[data-cat*="ARCANE"].active-cat {
  background: #ffecb3;
  color: #0b3d91;
  border-color: #4f7eea;
}
.cat-btn[data-cat*="WARRIOR"].active-cat,
.cat-btn[data-cat*="FORGED"].active-cat,
.cat-btn[data-cat*="LEGION"].active-cat {
  background: #ffe6d6;
  color: #8b2f12;
  border-color: #ff6f3c;
}
.cat-btn[data-cat*="SHADOW"].active-cat,
.cat-btn[data-cat*="COVEN"].active-cat {
  background: #e9ddff;
  color: #331a66;
  border-color: #8a6eff;
}
.cat-btn[data-cat*="DIVINE"].active-cat,
.cat-btn[data-cat*="CALLING"].active-cat {
  background: #fff7c2;
  color: #5a561a;
  border-color: #f1e16b;
}
.cat-btn[data-cat*="CURSED"].active-cat,
.cat-btn[data-cat*="BLIGHTED"].active-cat,
.cat-btn[data-cat*="CURSE"].active-cat {
  background: #ffd7c9;
  color: #3b1f0f;
  border-color: #b7410e;
}

/* małe dopasowania modal / responsywne */
.category-buttons { gap: 8px; }
.cat-btn:hover {
  background: #e91e63;
  color: #111;
}

.class-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.class-entry {
  background-color: rgba(20, 20, 20, 0.8);
  padding: 10px 15px;
  margin-bottom: 10px;
  border-left: 4px solid #e4c17d;
  border-radius: 10px;
}

.class-entry h3 {
  font-family: 'Diablo', serif;
  color: #e4c17d;
  letter-spacing: 1px;
}

.class-entry p {
  font-family: 'Cinzel', serif;
  color: #ccc;
  font-size: 14px;
  line-height: 1.4;
}

#classList {
  margin-top: 15px;
  color: #e9e6d7;
}

#classList h2 {
  font-family: 'Diablo';
  font-size: 28px;
  color: #ffcc66;
  text-align: center;
  margin-bottom: 10px;
  text-transform: uppercase;
}


    /* --- MOBILE --- */
@media (max-width: 768px) {
  /* całość w kolumnie */
  .top-bar {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
    width: 100%;
    text-align: center;
  }

  /* przyciski */
  .button {
    display: block;
    font-size: 14px;
    padding: 6px 14px;
    width: 70%;             /* szerokość dostosowana */
    max-width: 220px;
    text-align: center;
    margin: 0 auto;         /* wyśrodkowanie */
  }

  /* nagłówki i tytuły */
  h1, h2, h3, .page-title {
    font-size: 18px !important;
    text-align: center;
  }

  /* Counter – mniejszy i bliżej result */
  .counter-frame {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 90%;
    max-width: 400px;
    height: 50px;            /* niższy */
    text-align: center;
    margin: 0 auto;
  }

  /* Result – trochę wyższy */
  .result-frame {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 90%;
    max-width: 400px;
    height: 100px;
    text-align: center;
    margin: 0 auto;
  }

  /* Koło pośrodku */
  .wheel-container {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: 15px;
  }

  /* Samo koło dopasowane do ekranu */
  canvas {
    width: min(90vw, 90vh);   /* proporcjonalne */
    height: auto;
    aspect-ratio: 1 / 1;
    margin-top: 10px;
  }

  #pointer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, calc(-50% - 45vw)); /* ustawia nad kołem */
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-top: 25px solid #e91e63;
  z-index: 10;
}


  /* Komunikat końcowy mniejszy */
  #endMessage {
    font-size: 32px;
    padding: 8px;
    max-width: 90%;
  }
}




  </style>

</head>

  function wrapText(text, maxWidth, fontSize) {
  // Rozdziel po spacji i po ukośniku
  const words = text.split(/([ /])/); // zachowuje spacje i ukośniki jako osobne elementy
  const lines = [];
  let line = '';
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n];
    const metrics = ctx.measureText(testLine);
    const testWidth = metrics.width;
    if (testWidth > maxWidth && n > 0 && words[n] !== ' ' && words[n] !== '/') {
      lines.push(line.trim());
      line = words[n];
    } else {
      line = testLine;
    }
  }
  lines.push(line.trim());
  return lines;
}

    function drawWheel() {

  ctx.beginPath();
  ctx.moveTo(centerX, centerY);
  const flicker = Math.floor(performance.now() / 250) % 2 === 0;

  const shade = i % 3 === 0 ? 35     // ciemnoczerwony (krwisty)
              : i % 3 === 1 ? 45     // średni czerwony
              : 55;                  // jaśniejszy, stonowany czerwony

  ctx.fillStyle = (i === highlightedIndex)

  ctx.arc(centerX, centerY, radius, angle + i * angleStep, angle + (i + 1) * angleStep);

  // 🔹 ciemna linia między segmentami

  ctx.lineWidth = 2;

    function animate() {
      if (spinning) {
        angle += spinVelocity;
        spinVelocity *= 0.95;

        if (spinVelocity < 0.002) {
          spinning = false;

          if (segments.length === 0) {
            ended = true;
            spinButton.textContent = "The End";
            resetButton.style.display = "none";
            pointer.style.display = "none";
            saveState();
            return;
          }

          const numSegments = segments.length;
          const angleStep = (2 * Math.PI) / numSegments;
          let normAngle = angle % (2 * Math.PI);
          if (normAngle < 0) normAngle += 2 * Math.PI;
          const pointerAngle = 3 * Math.PI / 2;

          let diffAngle = pointerAngle - normAngle;
          if (diffAngle < 0) diffAngle += 2 * Math.PI;

          let winningIndex = Math.floor(diffAngle / angleStep) % numSegments;
          if (winningIndex < 0 || winningIndex >= numSegments) winningIndex = 0;

          const result = segments[winningIndex];
          highlightedIndex = winningIndex;
          highlightTimer = performance.now();
          lastResultToRemove = result;

          counterText.textContent = "Rolls: " + spinCount;
          resultText.textContent = "Score: " + result;
          soundSelect.play();
          saveState();

          if (segments.length === 1) {
            ended = true;
            spinButton.textContent = "The End";
            resetButton.style.display = "none";
            pointer.style.display = "none";
            saveState();
          }
        }
      }

      drawWheel();

      if (highlightedIndex !== null && performance.now() - highlightTimer > 2000) {
        highlightedIndex = null;
      }

      requestAnimationFrame(animate);
    }

// Fisher–Yates shuffle — tasowanie tablicy
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// ----------------- COMPENDIUM SCRIPT -----------------

// ✅ Kompendium (pozostaw Twoje const compendium = { ... } bez zmian)

// --- Obsługa kategorii, wyszukiwania i aktywnych przycisków ---

const searchInput = document.getElementById("classSearch");
const clearBtn = document.getElementById("clearSearch");
const listDiv = document.getElementById("classList");
let currentCategory = null;

// Funkcja renderująca klasy
function renderClasses(list) {
  listDiv.innerHTML = list
    .map(
      (c) => `
      <div class="class-entry">
        <h3>${c.name.toUpperCase()}</h3>
        <p>${c.desc}</p>
      </div>`
    )
    .join("");
}

// Funkcja czyszcząca podświetlenie aktywnych kategorii
function clearActiveButtons() {
  document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("active"));
}

// Obsługa kliknięcia kategorii
document.querySelectorAll(".cat-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    const cat = btn.dataset.cat.toUpperCase();
    // Jeżeli kliknięto ponownie tę samą kategorię — odkliknij
    if (currentCategory === cat) {
      currentCategory = null;
      clearActiveButtons();
      listDiv.innerHTML = "";
      return;
    }

    currentCategory = cat;
    clearActiveButtons();
    btn.classList.add("active");

    if (compendium[cat]) {
      renderClasses(compendium[cat]);
    }
  });
});

// Obsługa wyszukiwania
searchInput.addEventListener("input", () => {
  const query = searchInput.value.toLowerCase();

  if (!query) {
    if (currentCategory) renderClasses(compendium[currentCategory]);
    else listDiv.innerHTML = "";
    return;
  }

  const categories = currentCategory ? [currentCategory] : Object.keys(compendium);
  let results = [];

  categories.forEach((cat) => {
    if (compendium[cat]) {
      results.push(
        ...compendium[cat].filter((c) =>
          c.name.toLowerCase().includes(query)
        )
      );
    }
  });

  renderClasses(results);
});

// Obsługa przycisku czyszczenia
clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  if (currentCategory) renderClasses(compendium[currentCategory]);
  else listDiv.innerHTML = "";
  searchInput.focus();
});

// Modal – bez zmian
document.getElementById("compendiumButton").addEventListener("click", () => {
  document.getElementById("compendiumModal").style.display = "flex";
  playSound("parry");
});

document.getElementById("closeCompendium").addEventListener("click", () => {
  document.getElementById("compendiumModal").style.display = "none";
});

function playSound(file) {
  const s = new Audio(`${file}.mp3`);
  s.volume = 0.5;
  s.play();
}

  </script>
