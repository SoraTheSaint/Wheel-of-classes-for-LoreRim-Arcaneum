<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
<style>
    #counter {
  font-size: 68px;               /* mniejszy na mobile */
  font-family: "Ghastly Panic", cursive;
  color: red;
  line-height: 1;                /* żadnych dodatkowych odstępów */
  display: inline-block;         /* wysokość = wysokość tekstu */
  margin: 0;
  padding: 0;
}
body {
  margin: 0;
  padding: 0;
  background: transparent;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;                  /* żeby nie rozciągało body */
}


    @media (max-width: 768px) {
      #counter {
        font-size: 48px;     /* mniejszy na mobile */
      }
    }
  </style>
</head>
<body>
  <div id="counter">Death: 0</div>

  <script>
    function updateCounter() {
      const count = parseInt(localStorage.getItem("spinCount")) || 0;
      document.getElementById("counter").textContent = "Deaths : " + count;
    }
// ← aaaa
    updateCounter();
    setInterval(updateCounter, 500); 
  </script>
</body>
</html>
